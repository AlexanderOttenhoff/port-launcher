# Builds the downloadable (official, decomp) modules and publishes them as a release of the modules repository
# (private for now), whose latest release's index.json is the app's module index (ModuleRepository).
# Manual for now: run it after a module changes.
#
# Needs the secret MODULES_REPO_TOKEN: a fine-grained token with "Contents: read and write" on
# AlexanderOttenhoff/port-launcher-modules only. Recomp modules are never built here: their builds contain code
# generated from a ROM (docs/planning/ON_DEVICE_RECOMP.md).
name: Modules

on:
  workflow_dispatch:

env:
  MODULES_REPO: AlexanderOttenhoff/port-launcher-modules

jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Free disk space
        # The runner has ~14 GB free; six RelWithDebInfo modules ran out of space in the 2Ship build (2026-11-13).
        # None of these preinstalled toolchains are used here.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h / | tail -1
      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "ndk;26.0.10792818" "cmake;3.30.3" > /dev/null
          # The runner presets ANDROID_NDK_HOME to its own NDK (27.3 on 2026-11-13), which the build scripts honour:
          # pin the NDK every module is built and tested with.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818" >> "$GITHUB_ENV"
          # The runner image's package index can be stale (2026-11-13: python3-pil 404'd), so refresh it first.
          sudo apt-get update -qq
          # Pillow: tools/stage_icons.py. clang: the host Torch the libultraship modules' prepare.sh builds.
          sudo apt-get install -y -qq ninja-build python3-pil clang
      - name: Release tag
        run: echo "TAG=modules-$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build and package
        env:
          BASE_URL: https://github.com/${{ env.MODULES_REPO }}/releases/download/${{ env.TAG }}
        run: tools/ci/build_modules.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          # catalog.json is the local-testing copy; the app reads the hand-edited one on the repo's default branch.
          rm -f build/modules/dist/catalog.json
          gh release create "$TAG" build/modules/dist/* --repo "$MODULES_REPO" --latest \
            --title "$TAG" --notes "Modules built from ${GITHUB_SHA::7}."
